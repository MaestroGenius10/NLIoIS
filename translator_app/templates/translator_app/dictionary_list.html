<!-- translator_app/templates/translator_app/dictionary_list.html -->

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Словарь переводов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Словарь переводов</h1>
        <a href="{% url 'index' %}" class="btn btn-secondary">На главную</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">Английское слово</th>
                        <th scope="col">Русский перевод</th>
                    </tr>
                </thead>
                <tbody>
                    {% for pair in pairs %}
                    <tr>
                        <td>
                            <!-- Ссылка на детальную страницу для каждой пары -->
                            <a href="{% url 'dictionary_detail' pair.pk %}">
                                {{ pair.source_word.word }}
                            </a>
                        </td>
                        <td>{{ pair.target_word.word }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="2" class="text-center text-muted">Словарь пока пуст.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer class="text-center text-muted py-3 mt-5 border-top">
    <small>© 2025 Система машинного перевода | БГУИР</small>
</footer>

</body>
</html>
