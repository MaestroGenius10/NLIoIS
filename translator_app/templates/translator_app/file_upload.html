<!-- translator_app/templates/translator_app/file_upload.html -->

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка документов для перевода</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="text-center mb-4">
        <h1>Загрузка .txt файлов</h1>
        <p class="lead text-muted">Выберите один или несколько документов для перевода</p>
    </div>
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="file-input" class="form-label">Выберите файлы (.txt)</label>
                            <input type="file" name="source_files" id="file-input" class="form-control" accept=".txt" multiple required>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Загрузить и перевести</button>
                            <a href="{% url 'index' %}" class="btn btn-secondary">Отмена</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<footer class="text-center text-muted py-3 mt-5 border-top">
    <small>© 2025 Система машинного перевода | БГУИР</small>
</footer>
</body>
</html>
