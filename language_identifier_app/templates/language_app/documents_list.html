<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список документов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">Все документы</h2>

    {% if documents %}
        <div class="list-group">
            {% for doc in documents %}
                <a href="{% url 'document_detail' doc.id %}" class="list-group-item list-group-item-action mb-2">
                    <h5>{{ doc.name }}</h5>
                    <small class="text-muted">Дата загрузки: {{ doc.upload_date }}</small>
                </a>
            {% endfor %}
        </div>
    {% else %}
        <p>Документов пока нет.</p>
    {% endif %}

    <a href="{% url 'index' %}" class="btn btn-primary mt-4">Вернуться на главную</a>
</div>

</body>
</html>
