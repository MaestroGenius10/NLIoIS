<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор документов для анализа</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">Выберите документы для анализа</h2>

    {% if documents %}
        <form method="post" action="{% url 'analyze_selected_documents' %}">
            {% csrf_token %}
            <div class="mb-3">
                <select name="document_ids" class="form-select" multiple size="10" required>
                    {% for doc in documents %}
                        <option value="{{ doc.id }}">{{ doc.name }} ({{ doc.upload_date }})</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Провести анализ</button>
        </form>
    {% else %}
        <p>Нет доступных документов для анализа.</p>
    {% endif %}

    <a href="{% url 'index' %}" class="btn btn-secondary mt-4">Вернуться на главную</a>
</div>

</body>
</html>
