<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование статьи: {{ article.title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .button {
            background-color: #007BFF;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }
        .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Редактирование статьи: {{ article.title }}</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="title">Заголовок:</label>
                {{ form.title }}
            </div>
            <div class="form-group">
                <label for="author">Автор:</label>
                {{ form.author }}
            </div>
            <div class="form-group">
                <label for="date">Дата:</label>
                {{ form.date }}
            </div>
            <div class="form-group">
                <label for="sport">Вид спорта:</label>
                {{ form.sport }}
            </div>
            <div class="form-group">
                <label for="content">Текст статьи:</label>
                {{ form.content }}
            </div>
            <button type="submit" class="button">Сохранить изменения</button>
            <a href="{% url 'view_article_text' article_id=article.id %}" class="button">Отмена</a>
        </form>
    </div>
</body>
</html>
