<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лингвистический процессор - Загрузка файла</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 20px;
        }
        .container {
            width: 50%;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .button {
            background-color: #007BFF;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }
        .button:hover {
            background-color: #0056b3;
        }
        .file-name {
            margin-top: 10px;
            font-size: 16px;
            color: #555;
        }
        .button-container {
            margin-top: 20px;
        }
        .file-input input[type="file"] {
            display: none;
        }
        .file-input .upload-button {
            padding: 12px 24px;
            background-color: #28a745;
            border-radius: 5px;
            cursor: pointer;
            color: #fff;
            transition: background-color 0.3s ease;
        }
        .file-input .upload-button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Добро пожаловать!</h1>

        <!-- Кнопка для загрузки файла -->
        <div class="file-input">
            <form id="upload-form" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <label class="upload-button" for="file-upload">Загрузить файл</label>
                <input type="file" id="file-upload" name="file" accept=".txt" required onchange="displayFileName()">
            </form>
            <div class="file-name" id="file-name">{% if file_name %}Загруженный файл: {{ file_name }}{% endif %}</div>
        </div>

        <!-- Кнопка для проведения синтаксического анализа -->
        <div class="button-container">
            <form id="analyze-form" method="post" action="{% url 'analyze_file' %}">
                {% csrf_token %}
                <button type="submit" class="button">Провести синтаксический анализ</button>
            </form>
        </div>
         <div class="button-container">
            <form id="dictionary-form" method="post" action="{% url 'view_dictionary' %}">
                {% csrf_token %}
                <button type="submit" class="button">Просмотреть словарь</button>
            </form>
        </div>
        <button class="button" onclick="showHelp()">Помощь</button>
    </div>

    <script>
        function displayFileName() {
            var input = document.getElementById('file-upload');
            var fileNameDisplay = document.getElementById('file-name');
            if (input.files.length > 0) {
                fileNameDisplay.textContent = "Загруженный файл: " + input.files[0].name;
            }
        }
        function showHelp() {
            alert("Добро пожаловать в приложение для синтаксического анализа! Здесь вы можете загружать текстовые файлы в формате TXT для синтаксического анализа. Вы можете просмотреть, редактировать, изменить синтаксическую информацию, полученную в результате анализа текста, а также построить синтаксическое дерево для интересующего предложения.");
        }
    </script>
</body>
</html>
