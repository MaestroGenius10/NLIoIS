<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактировать предложение</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 20px;
        }
        .container {
            width: 80%;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            text-align: left;
        }
        .button {
            background-color: #007BFF;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            margin: 5px;
        }
        .button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Редактировать предложение</h1>
        <form method="post">
            {% csrf_token %}
            {{ sentence_form.as_p }}
            <h2>Токены:</h2>
            {% for form in token_forms %}
                {{ form.as_p }}
            {% endfor %}
            <button type="submit" class="button">Сохранить изменения</button>
        </form>
        <a href="{% url 'view_dictionary' %}" class="button">Вернуться в словарь</a>
    </div>
</body>
</html>
