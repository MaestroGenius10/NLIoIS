<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>{{ title }}</title>
    <style>
        .loading-spinner {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.7);
            z-index: 1050;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">{{ title }}</h1>

        {% if error_message %}
            <div class="alert alert-warning" role="alert">
                {{ error_message }}
            </div>
        {% endif %}

        <form id="ttsForm" class="mb-5">
            <div class="mb-3">
                <label for="text_content" class="form-label">Текст для озвучивания:</label>
                <textarea class="form-control" id="text_content" rows="10" placeholder="Введите текст, который нужно озвучить..."></textarea>
                <div id="charCount" class="form-text text-end">0 символов</div>
            </div>

            <div class="row mb-3">
                <div class="col-12">
                    <label for="voice_select" class="form-label">Голос:</label>
                    <select class="form-select" id="voice_select" name="voice_id">
                        {% for voice in available_voices %}
                            <option value="{{ voice.voice_id }}" {% if voice.voice_id == default_voice_id %}selected{% endif %}>
                                {{ voice.name }} ({{ voice.category|capfirst }}{% if voice.labels.accent %}, {{ voice.labels.accent }}{% endif %})
                            </option>
                        {% empty %}
                            <option value="">Голоса не загружены</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- ВЫПАДАЮЩИЙ СПИСОК МОДЕЛЕЙ УДАЛЕН. -->
                <!-- Вместо него мы используем скрытое поле для передачи ID модели -->
                <input type="hidden" id="model_id" value="{{ default_model_id }}">
            </div>

            <div class="row mb-4">
                <div class="col-md-6">
                    <label for="stability_range" class="form-label">Стабильность (Stability): <span id="stability_value">0.75</span></label>
                    <input type="range" class="form-range" id="stability_range" min="0" max="1" step="0.01" value="0.75">
                </div>
                <div class="col-md-6">
                    <label for="similarity_boost_range" class="form-label">Усиление сходства (Similarity Boost): <span id="similarity_boost_value">0.75</span></label>
                    <input type="range" class="form-range" id="similarity_boost_range" min="0" max="1" step="0.01" value="0.75">
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-lg"><i class="fas fa-magic me-2"></i>Озвучить!</button>
            <a href="{% url 'index' %}" class="btn btn-secondary btn-lg ms-2">На главную</a>
        </form>

        <div id="audioPlayerContainer" class="mt-5 p-4 bg-light rounded shadow-sm" style="display: none;">
            <h4>Результат озвучивания:</h4>
            <audio id="audioPlayer" controls class="w-100"></audio>
            <div class="text-end mt-2">
                <small class="text-muted" id="requestInfo"></small>
            </div>
        </div>

        <div id="errorAlert" class="alert alert-danger mt-4" role="alert" style="display: none;">
            Произошла ошибка: <span id="errorMessage"></span>
        </div>
    </div>

    <!-- Загрузочный спиннер -->
    <div class="loading-spinner">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Загрузка...</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const ttsForm = document.getElementById('ttsForm');
            const textContent = document.getElementById('text_content');
            const charCount = document.getElementById('charCount');
            const voiceSelect = document.getElementById('voice_select');
            // 'modelSelect' удален, так как элемента больше нет
            const stabilityRange = document.getElementById('stability_range');
            const stabilityValue = document.getElementById('stability_value');
            const similarityBoostRange = document.getElementById('similarity_boost_range');
            const similarityBoostValue = document.getElementById('similarity_boost_value');
            const audioPlayerContainer = document.getElementById('audioPlayerContainer');
            const audioPlayer = document.getElementById('audioPlayer');
            const requestInfo = document.getElementById('requestInfo');
            const errorAlert = document.getElementById('errorAlert');
            const errorMessage = document.getElementById('errorMessage');
            const loadingSpinner = document.querySelector('.loading-spinner');

            textContent.addEventListener('input', function() { charCount.textContent = `${this.value.length} символов`; });
            stabilityRange.addEventListener('input', function() { stabilityValue.textContent = parseFloat(this.value).toFixed(2); });
            similarityBoostRange.addEventListener('input', function() { similarityBoostValue.textContent = parseFloat(this.value).toFixed(2); });

            ttsForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                errorAlert.style.display = 'none';
                audioPlayerContainer.style.display = 'none';

                const text = textContent.value.trim();
                const voiceId = voiceSelect.value;
                // ИЗМЕНЕНИЕ: Получаем ID модели из скрытого поля
                const modelId = document.getElementById('model_id').value;
                const stability = parseFloat(stabilityRange.value);
                const similarityBoost = parseFloat(similarityBoostRange.value);

                if (!text) {
                    errorMessage.textContent = 'Пожалуйста, введите текст для озвучивания.';
                    errorAlert.style.display = 'block';
                    return;
                }

                loadingSpinner.style.display = 'flex';

                try {
                    const response = await fetch('{% url "synthesize_speech_api" %}', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            text_content: text,
                            voice_id: voiceId,
                            model_id: modelId, // Отправляем ID статической модели
                            stability: stability,
                            similarity_boost: similarityBoost
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error || `Ошибка HTTP: ${response.status}`);
                    }

                    const data = await response.json();
                    audioPlayer.src = data.audio_url;
                    audioPlayer.load();
                    audioPlayerContainer.style.display = 'block';
                    requestInfo.textContent = `Запрос ID: ${data.request_id}`;
                    audioPlayer.play();

                } catch (error) {
                    errorMessage.textContent = error.message;
                    errorAlert.style.display = 'block';
                } finally {
                    loadingSpinner.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
