<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Синтезатор речи</title>
</head>
<body>
<div class="container d-flex flex-column justify-content-center" style="min-height: 100vh;">
    <div class="text-center p-5 rounded-3 bg-light shadow-sm">
        <h1 class="display-4">Синтезатор речи</h1>
        <p class="lead">
            Интеллектуальная система для преобразования текста в речь.
        </p>
        <hr class="my-4">
        <p>Выберите действие:</p>
        <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
            <a class="btn btn-primary btn-lg" href="{% url 'text_to_speech' %}" role="button">
                <i class="fas fa-play-circle me-2"></i>Озвучить текст
            </a>
            <a class="btn btn-success btn-lg" href="{% url 'speech_history' %}" role="button">
                <i class="fas fa-history me-2"></i>История озвучиваний
            </a>
            <a class="btn btn-warning btn-lg" href="{% url 'recognize_speech' %}" role="button">
                <i class="fas fa-microphone-alt me-2"></i>Распознать речь
            </a>
            <a class="btn btn-success btn-lg" href="{% url 'speech_history' %}" role="button">
                <i class="fas fa-history me-2"></i>История озвучиваний
            </a>
            <a class="btn btn-info btn-lg" href="{% url 'help_page' %}" role="button">
                <i class="fas fa-question-circle me-2"></i>Справка по голосам
            </a>
        </div>
    </div>
</div>
</body>
</html>
