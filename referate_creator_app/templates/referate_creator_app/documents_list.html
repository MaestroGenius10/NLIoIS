<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список документов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="mb-4">📄 Загруженные документы</h2>

    {% if documents %}
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Название</th>
                    <th>Дата загрузки</th>
                </tr>
            </thead>
            <tbody>
                {% for doc in documents %}
                    <tr onclick="window.location='{% url 'document_detail' doc.id %}'" style="cursor:pointer;">
                        <td>{{ doc.title }}</td>
                        <td>{{ doc.upload_date|date:"d.m.Y H:i" }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    {% else %}
        <p>Документов пока нет.</p>
    {% endif %}

    <a href="{% url 'index' %}" class="btn btn-secondary mt-4">Вернуться на главную</a>
</div>

</body>
</html>
